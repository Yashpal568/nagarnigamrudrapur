<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | Nagar Nigam Rudrapur</title>
    <link rel="stylesheet" href="wp-content/themes/sdo-theme/style.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: #f4f6f9;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .error-card {
            background: #ffffff;
            padding: 40px;
            max-width: 550px;
            text-align: center;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin: 20px;
        }
        h1 {
            color: #0b4f8a;
            font-size: 72px;
            margin: 0 0 10px 0;
        }
        h2 {
            font-size: 24px;
            margin: 0 0 15px 0;
            color: #2c3e50;
        }
        p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 25px;
        }
        .btn {
            display: inline-block;
            background: #0b4f8a;
            color: #fff;
            padding: 12px 24px;
            border-radius: 4px;
            text-decoration: none;
            font-weight: 600;
            margin: 5px;
            transition: background 0.2s;
        }
        .btn:hover {
            background: #063156;
        }
        .btn-outline {
            background: transparent;
            color: #0b4f8a;
            border: 2px solid #0b4f8a;
        }
        .btn-outline:hover {
            background: #0b4f8a;
            color: #fff;
        }
    </style>
    <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
</head>
<body>
    <div class="error-card">
        <h1>404</h1>
        <h2>Page Not Found</h2>
        <p>The page you are looking for might have been moved, renamed, or is temporarily unavailable.</p>
        <div>
            <a href="./" class="btn">Return to Homepage</a>
            <a href="document-category/balance-sheet/" class="btn btn-outline">Balance Sheets</a>
        </div>
    </div>
</body>
</html>
